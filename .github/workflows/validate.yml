name: Validate catalog

# Blocks a pull request when catalog.json, the documents and the releases disagree.

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Catalog, documents and releases agree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/validate_catalog.py --releases
      - name: Product READMEs up to date
        run: python tools/build_readmes.py --check
